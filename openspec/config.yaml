schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
    Project: urTPE — turn the Taipei City Government's urban-renewal approved-cases
    list (臺北市都市更新核定案件一覽表, 1,439 approvals as emitted from the 1151006
    gazette, dated 2002-03-21–2026-10-01,
    統計至 2026-10-01) into a clean, merged dataset with per-project history.
    Pipeline: PDF (gov.taipei) -> ruled-table extraction (pymupdf find_tables,
    strategy="lines") -> raw.tsv -> cleansing -> clean.tsv -> similarity merge ->
    merged.tsv (project_id anchored on the latest approval) -> projects.json (history
    graph) + viewer. Cell boundaries come from the document's own ruling lines; there
    are no stored x-coordinate bands and no positional or text-alignment fallback.
    A structure the reader cannot interpret exactly (merged cell, page without a
    table, ragged row) aborts the run rather than producing partial output, and a
    completeness tripwire gates every emission.
    Calendars: the city published ROC dates (115/8/27) until the 1151002 gazette,
    which switched to Gregorian (2026/9/24); both are accepted per cell and
    normalized to ISO-8601. published_date is read from the document's 統計至 line.
    Every ingested gazette is archived outside the git working tree with an
    append-only index, and each ingestion is reconciled against its predecessor.
    Domain: one 更新單元 (renewal unit) receives many stage approvals (擬訂 /
    變更(第N次), 事業計畫 / 權利變換計畫, 甲/A/B區段). Parcel coverage changes
    (13筆(原11筆)) and parcel renumbering (689地號(原726地號)) break exact-key
    matching, so unit identity must be found by similarity, not equality. Named
    anchors (原東星大樓基地) identify units with no stable parcel basis.
    Key constraints:
    - The list is newest-first (編號 1 = latest), and 編號 is a coordinate in a
    mutable list, not an identity: new approvals are prepended, the older export was
    insertion-ordered while the newer one re-sorts history by 核定日期, and the city
    edits and re-dates historical rows. The shift is therefore NOT affine —
    1150820->1150827 moved every matched record by exactly +5, while
    1150827->1151002 moved records in both directions. Never key anything durable
    on 編號. (The specific per-record offsets once quoted here came from a reader
    with two known cell-content faults and are withdrawn; see design.md D6/D10.)
    - A 地號 cell can be defective in two unrelated ways, and the distinction
    decides what the pipeline does. The city's layout sometimes prints the page
    number INSIDE the last row's 地號 cell, which is the reader's fault and is
    stripped only when the digits equal that page. Separately, the city truncates
    long 地號 cells at the printed row height and never draws the remainder, which
    is the publisher's fault: the text is absent from the PDF, so those records are
    excluded and named, never repaired by inference. A truncated cell whose parcel
    count already matches its own 案名's declared count has lost only the closing
    phrase and is kept. Any declared exclusion must be reported with its count, or
    a short gazette reads as a complete one.
    - project_id = slug of the latest approval's normalized land core. It churns
    (~11% of multi-record families have moved at least once, always early in a
    project's life) and is not a stable identity either; .link_cache directories are
    migrated through data/project_aliases.json, which pairs identities on member
    content and refuses ambiguous pairs. That file is tracked; it is configuration,
    not derived data.
    - Reconciliation can only assert three things about a new gazette: how many
    approvals are newer than the predecessor's newest date, the net change in total
    records, and which calendar was used. A per-record content diff cannot
    distinguish a deletion from an edit or a re-dating, because in the published data
    they are the same observation; historical movement is therefore reported, not
    treated as removal.
    - ~70% of records are repeat approvals of the same unit; ~430 are singletons.
    - Known data errors to normalize: 松化區→松山區, 計劃→計畫, ㄧ→一,
    權利變換案 == 權利變換計畫案; ambiguous cases go to a review/flag column.
    - Untreated source typos (present in every gazette, city-side):
    臺北市投區 (missing 北), 臺北大安區 / 臺北士林區 (missing 市), and rows whose
    案名 spills into the 地號 cell.
    - Manual corrections live in an append-only ledger keyed on land core plus
    approval date, never on 編號, and are applied after cleansing and before merge.
    Dated one-off scripts that patch emitted output are obsolete by construction.
    - Single-writer rule: one run per output tree, enforced by urtpe/lock.py after
    the 2026-08-24 incident in which four concurrent runs wiped 47 caches.
    Tech stack: Python 3, pymupdf (ruled-table extraction), agent-assisted
    cleansing & merge, JSON history graph + browser viewer.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Why must name the actors/roles involved and the concrete problem or event
      that motivates the change (e.g. parse artifacts from line-wrapped cells,
      the 松化區 district typo, or ~70% of records being stage repeats of the
      same unit), not just an abstract problem statement."
    - "Scope decisions are provisional: the PDF-parsing and similarity-threshold
      POC may invalidate assumptions, so state which parts are gated on POC
      findings (link ≥ 0.7, flag band 0.5–0.7, feature weights — starting
      points, not contracts)."
  design:
    - "Context must state the actors, domain events, and system boundaries before
      Decisions — for this batch pipeline the flow is PDF -> positional parse ->
      raw.tsv -> cleanse -> clean.tsv -> similarity merge -> merged.tsv ->
      projects.json (+ viewer)."
    - "Keep pure pipeline logic (cleansing rules, similarity scoring, unit
      clustering, anchor selection, name-core slugging) separated from I/O
      adapters (PDF extraction, TSV/JSON read/write, browser viewer) — a
      lightweight port/adapter split, not full Clean Architecture layering
      (deliberately minimal for a batch data pipeline, no CRUD domain)."
  specs:
    - "Requirements must describe externally observable behavior."
    - "Every requirement must include BDD-style scenarios using WHEN/THEN."
  tasks:
    - "Put test-writing tasks before implementation tasks."
    - "Test-first gate: a change without a test-writing group SHALL declare the
      escape hatch as the first non-heading line of tasks.md (`> POC: <reason>`);
      a change with a test-writing group SHALL have every task in it fully
      checked before any implementation task can be marked complete."
    - "Separate domain/use-case tasks from adapter/infrastructure tasks."
    - "Include acceptance or end-to-end tests for each user-visible requirement."
    - "A POC (data-gathering experiment) must come first: validate positional
      PDF parsing on real pages and calibrate the similarity threshold against
      known clusters (e.g. 中華工程 寶清段, 永昌段三小段159, 逸仙段二小段 151)
      before building the merge pipeline around them."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
operations:
  apply:
    guidance:
      - "Before marking any implementation task complete, verify the test-first
        gate in tasks.md: locate the test-writing group (or the `> POC:` escape
        hatch on the first non-heading line) and confirm every test-writing task
        is checked. Report the gate result in the apply summary."
      - "Verify the POC ran first: if tasks.md starts with a POC, its findings
        must be reflected in the tasks/specs before applying further work."
      - "Keep the apply summary concise: gate result, files changed, and any
        flags/review items surfaced by the cleansing step."